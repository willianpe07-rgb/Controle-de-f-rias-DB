<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALE - Vacation Control</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", sans-serif;
    background: #f4f7fa;
    color: #1f2937;
}

/* BANNER */

.banner {
    background: url("oficina.jpg") center/cover no-repeat;
    min-height: 320px;
    position: relative;
}

.overlay {
    background: rgba(255,255,255,0.88);
    min-height: 320px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

h1 {
    color: #004b87;
    font-size: 2.4rem;
    margin-bottom: 10px;
}

h2 {
    font-size: 1.1rem;
    font-weight: 500;
    margin-bottom: 15px;
}

.inspetor {
    font-weight: 600;
    margin-top: 10px;
}

/* DASHBOARD */

.dashboard {
    padding: 30px;
}

.top-bar {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

input {
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    flex: 1;
    min-width: 220px;
    font-size: 15px;
}

button {
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    background: #005bac;
    color: white;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
}

button:hover {
    background: #004080;
}

/* RESUMO */

.summary {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.box {
    background: white;
    padding: 24px;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}

.box h3 {
    font-size: 14px;
    margin-bottom: 10px;
    color: #64748b;
}

.box span {
    font-size: 2rem;
    font-weight: bold;
    color: #003b70;
}

/* CARDS */

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(320px,1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.05);
    border-top: 4px solid #005bac;
}

.card h3 {
    margin-bottom: 15px;
    color: #0f172a;
}

.card p {
    margin-bottom: 8px;
    line-height: 1.5;
}

.status {
    display: inline-block;
    margin-top: 15px;
    padding: 8px 16px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 14px;
}

.programado {
    background: #dcfce7;
    color: #166534;
}

.sem-programacao {
    background: #f1f5f9;
    color: #475569;
}

.actions {
    margin-top: 18px;
    display: flex;
    gap: 10px;
}

.btn-delete {
    background: #dc2626;
}

.btn-delete:hover {
    background: #b91c1c;
}

/* RESPONSIVO */

@media (max-width: 768px) {
    .dashboard {
        padding: 18px;
    }

    h1 {
        font-size: 1.7rem;
    }

    .overlay {
        padding: 25px;
    }
}
</style>
</head>
<body>

<header class="banner">
    <div class="overlay">
        <h1>VALE – Vacation Control</h1>
        <h2>Gestão estratégica de férias para máxima performance operacional</h2>
        <p>Oficina de Perfuratrizes</p>
        <p class="inspetor">Inspetor Orientador: William Silva</p>
    </div>
</header>

<main class="dashboard">

    <div class="top-bar">
        <input type="text" id="nome" placeholder="Nome do colaborador">
        <input type="date" id="ferias1">
        <input type="date" id="retorno1">
        <button onclick="adicionarFuncionario()">+ Adicionar</button>
    </div>

    <section class="summary">
        <div class="box">
            <h3>Total de Empregados</h3>
            <span id="total">0</span>
        </div>

        <div class="box">
            <h3>Programados</h3>
            <span id="programados">0</span>
        </div>

        <div class="box">
            <h3>Sem Programação</h3>
            <span id="semProgramacao">0</span>
        </div>
    </section>

    <section class="cards" id="listaFuncionarios"></section>

</main>

<script>
let funcionarios = JSON.parse(localStorage.getItem("funcionarios")) || [];

function salvarDados() {
    localStorage.setItem("funcionarios", JSON.stringify(funcionarios));
}

function atualizarDashboard() {
    document.getElementById("total").innerText = funcionarios.length;

    let programados = funcionarios.filter(f => f.ferias1).length;
    document.getElementById("programados").innerText = programados;

    document.getElementById("semProgramacao").innerText =
        funcionarios.length - programados;
}

function renderizarFuncionarios() {
    const lista = document.getElementById("listaFuncionarios");
    lista.innerHTML = "";

    funcionarios.forEach((func, index) => {
        lista.innerHTML += `
            <div class="card">
                <h3>👷 ${func.nome}</h3>

                <p><strong>1ª Férias:</strong> ${func.ferias1 || "Não definida"}</p>
                <p><strong>Retorno:</strong> ${func.retorno1 || "Não definido"}</p>

                <span class="status ${
                    func.ferias1 ? "programado" : "sem-programacao"
                }">
                    ${func.ferias1 ? "🟢 Programado" : "⚫ Sem programação"}
                </span>

                <div class="actions">
                    <button onclick="editarFuncionario(${index})">
                        Editar
                    </button>

                    <button class="btn-delete"
                        onclick="removerFuncionario(${index})">
                        Excluir
                    </button>
                </div>
            </div>
        `;
    });

    atualizarDashboard();
    salvarDados();
}

function adicionarFuncionario() {
    const nome = document.getElementById("nome").value;
    const ferias1 = document.getElementById("ferias1").value;
    const retorno1 = document.getElementById("retorno1").value;

    if (!nome) {
        alert("Digite o nome do colaborador.");
        return;
    }

    funcionarios.push({
        nome,
        ferias1,
        retorno1
    });

    document.getElementById("nome").value = "";
    document.getElementById("ferias1").value = "";
    document.getElementById("retorno1").value = "";

    renderizarFuncionarios();
}

function removerFuncionario(index) {
    funcionarios.splice(index, 1);
    renderizarFuncionarios();
}

function editarFuncionario(index) {
    const novoNome = prompt(
        "Editar nome:",
        funcionarios[index].nome
    );

    if (novoNome !== null) {
        funcionarios[index].nome = novoNome;
        renderizarFuncionarios();
    }
}

renderizarFuncionarios();
</script>

</body>
</html>
